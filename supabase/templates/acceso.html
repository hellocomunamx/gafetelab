<div style="font-family:Arial,Helvetica,sans-serif;color:#1B1F3B;max-width:480px;margin:0 auto;padding:24px;">
  <p style="font-size:20px;font-weight:bold;margin:0 0 16px;">LaGafetería</p>
  <p style="margin:0 0 16px;">Hola. Entra a tu cuenta con este botón:</p>
  <p style="margin:0 0 24px;">
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#E63B2E;color:#fff;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:999px;">Entrar a mi cuenta</a>
  </p>
  <p style="margin:0 0 8px;">O escribe este código en la página donde pediste entrar:</p>
  <p style="font-size:28px;font-weight:bold;letter-spacing:4px;margin:0 0 24px;">{{ .Token }}</p>
  <p style="font-size:13px;color:#5C6178;margin:0;">La liga y el código sirven una sola vez y vencen en una hora. Si no pediste entrar, ignora este correo.</p>
</div>
